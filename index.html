<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BH LAB — 50 mini-applications</title>
<style>body{background:#0c0e12;color:#f5f5f5;font:16px system-ui;margin:0}header{padding:28px 18px;background:#151922;border-bottom:1px solid #735d27}h1{color:#e8c36a;margin:0}p{line-height:1.5;color:#c5c7ce}.wrap{max-width:1000px;margin:auto;padding:18px}input,select,button{font:inherit;border-radius:9px;padding:12px;box-sizing:border-box}input,select{background:#222833;color:white;border:1px solid #4b515d;width:100%}button{background:#e8c36a;border:0;color:#111;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{border:1px solid #3a3e48;background:#191d25;padding:17px;border-radius:12px;text-align:left;color:#fff}.card b{color:#e8c36a;display:block;margin-bottom:8px}.card small{color:#c5c7ce}.toolbar{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.toolbar>*{flex:1;min-width:180px}.panel{background:#191d25;padding:22px;border:1px solid #695526;border-radius:14px;margin:18px 0}label{display:block;margin:13px 0}label span{display:block;margin-bottom:6px;color:#ddd}#result{font-size:1.5rem;color:#e8c36a;margin-top:20px}#note{font-size:.9rem}#back{margin-bottom:14px}footer{padding:30px;color:#aaa}</style>
<header><div class="wrap"><h1>BH LAB</h1><p>50 mini-outils gratuits à tester — prototypes, sans abonnement ni collecte de données.</p></div></header>
<main class="wrap"><section id="catalog"><div class="toolbar"><input id="search" placeholder="Rechercher une application…"><select id="category"><option value="">Tous les univers</option></select></div><p id="count"></p><div class="grid" id="cards"></div></section>
<section id="app" hidden><button id="back">← Toutes les applications</button><div class="panel"><h2 id="title"></h2><p id="subtitle"></p><div id="fields"></div><button id="calculate">Calculer</button><div id="result" aria-live="polite"></div><p id="note">Simulation indicative. Vérifiez les hypothèses et les frais réels avant toute décision.</p></div></section></main><footer class="wrap">BH LAB • Démonstrateurs autonomes • Les données restent dans votre navigateur.</footer>
<script>
const apps=[["BH Profit", "Commerce", "Marge achat-revente", ["Prix d'achat", "Prix de vente", "Frais"], "profit"], ["BH Auto", "Auto", "Budget voiture d'occasion", ["Prix voiture", "Réparations prévues", "Carte grise et frais"], "sum"], ["BH Immo", "Immobilier", "Rendement locatif brut", ["Loyer mensuel", "Prix du bien", "Frais d'achat"], "yield"], ["BH Budget", "Finances", "Reste à vivre mensuel", ["Revenus", "Charges fixes", "Dépenses variables"], "subtract"], ["BH Épargne", "Finances", "Objectif d'épargne", ["Objectif", "Épargne actuelle", "Versement mensuel"], "months"], ["BH Crédit", "Finances", "Mensualité de prêt", ["Capital emprunté", "Taux annuel (%)", "Durée (mois)"], "loan"], ["BH Freelance", "Travail", "Tarif journalier cible", ["Revenu mensuel visé", "Charges mensuelles", "Jours facturés"], "daily"], ["BH TVA", "Commerce", "Prix TTC", ["Prix HT", "TVA (%)"], "vat"], ["BH Remise", "Shopping", "Prix après remise", ["Prix initial", "Remise (%)"], "discount"], ["BH Pourboire", "Voyage", "Addition partagée", ["Addition", "Pourboire (%)", "Personnes"], "split"], ["BH Carburant", "Auto", "Coût de trajet", ["Distance (km)", "Consommation L/100 km", "Prix du litre"], "fuel"], ["BH Kilométrage", "Auto", "Coût carburant annuel", ["Kilomètres annuels", "Consommation L/100 km", "Prix du litre"], "fuel"], ["BH Électrique", "Auto", "Coût d'une recharge", ["Énergie (kWh)", "Prix du kWh"], "multiply"], ["BH Cuisine", "Cuisine", "Coût d'une recette", ["Ingrédients (€)", "Énergie (€)", "Portions"], "perunit"], ["BH Restaurant", "Restauration", "Marge d'un plat", ["Prix de vente", "Ingrédients", "Autres coûts"], "profit2"], ["BH Boulangerie", "Restauration", "Coût par unité", ["Coût total", "Quantité produite"], "perunit2"], ["BH Événement", "Événementiel", "Budget restant", ["Budget total", "Lieu", "Prestataires"], "subtract"], ["BH Mariage", "Événementiel", "Budget par invité", ["Budget total", "Nombre d'invités"], "perunit2"], ["BH Voyage", "Voyage", "Budget de séjour", ["Transport", "Hébergement", "Autres dépenses"], "sum"], ["BH Vacances", "Voyage", "Budget quotidien", ["Budget disponible", "Nombre de jours"], "perunit2"], ["BH Location", "Immobilier", "Coût d'emménagement", ["Dépôt de garantie", "Premier loyer", "Autres frais"], "sum"], ["BH Travaux", "Maison", "Budget travaux", ["Matériaux", "Main d'œuvre", "Imprévus"], "sum"], ["BH Peinture", "Maison", "Litres de peinture", ["Surface (m²)", "Rendement m²/L", "Nombre de couches"], "paint"], ["BH Carrelage", "Maison", "Carreaux nécessaires", ["Surface (m²)", "Surface par carreau (m²)", "Marge de perte (%)"], "tiles"], ["BH Jardin", "Jardin", "Volume de terre", ["Longueur (m)", "Largeur (m)", "Profondeur (m)"], "volume"], ["BH Potager", "Jardin", "Nombre de plants", ["Longueur (m)", "Largeur (m)", "Surface par plant (m²)"], "plants"], ["BH Piscine", "Maison", "Volume d'eau", ["Longueur (m)", "Largeur (m)", "Profondeur moyenne (m)"], "volume"], ["BH Eau", "Écologie", "Coût de consommation d'eau", ["Volume (m³)", "Prix par m³"], "multiply"], ["BH Énergie", "Écologie", "Coût électrique", ["Puissance (W)", "Heures d'utilisation", "Prix du kWh"], "power"], ["BH Solaire", "Écologie", "Économie annuelle estimée", ["Production annuelle (kWh)", "Valeur du kWh autoconsommé"], "multiply"], ["BH Sport", "Sport", "Allure de course", ["Distance (km)", "Temps (minutes)"], "pace"], ["BH Marche", "Sport", "Temps de marche", ["Distance (km)", "Vitesse (km/h)"], "walk"], ["BH Vélo", "Sport", "Temps de trajet", ["Distance (km)", "Vitesse (km/h)"], "walk"], ["BH Lecture", "Éducation", "Temps pour terminer un livre", ["Pages restantes", "Pages par heure"], "perunit2"], ["BH Études", "Éducation", "Moyenne pondérée", ["Note 1", "Coefficient 1", "Note 2", "Coefficient 2"], "weighted"], ["BH Révision", "Éducation", "Sessions nécessaires", ["Heures à réviser", "Minutes par session"], "sessions"], ["BH Bébé", "Famille", "Budget couches mensuel", ["Couches par jour", "Prix par couche", "Jours"], "triple"], ["BH Famille", "Famille", "Budget activités", ["Budget total", "Nombre d'enfants"], "perunit2"], ["BH Animal", "Animaux", "Budget alimentation", ["Quantité par jour (kg)", "Prix par kg", "Jours"], "triple"], ["BH Chien", "Animaux", "Durée d'un sac de croquettes", ["Poids du sac (kg)", "Consommation par jour (kg)"], "perunit2"], ["BH E-commerce", "Commerce", "Marge boutique", ["Prix de vente", "Coût produit", "Livraison", "Commission"], "profit3"], ["BH Marketplace", "Commerce", "Prix minimum de vente", ["Prix d'achat", "Frais", "Marge souhaitée"], "sum"], ["BH Stock", "Commerce", "Valeur du stock", ["Quantité", "Coût unitaire"], "multiply"], ["BH Publicité", "Marketing", "Retour publicitaire brut", ["Chiffre d'affaires attribué", "Dépense publicité"], "roas"], ["BH Conversion", "Marketing", "Taux de conversion", ["Commandes", "Visiteurs"], "ratio"], ["BH Réseaux", "Marketing", "Taux d'engagement", ["Interactions", "Vues"], "ratio"], ["BH Abonnement", "Business", "Revenu mensuel récurrent", ["Abonnés payants", "Prix mensuel"], "multiply"], ["BH SaaS", "Business", "Revenu net simplifié", ["Abonnés", "Prix mensuel", "Coûts mensuels"], "saas"], ["BH Objectif", "Business", "Ventes nécessaires", ["Objectif de chiffre d'affaires", "Prix moyen de vente"], "ceilratio"], ["BH Temps", "Productivité", "Valeur du temps économisé", ["Heures économisées", "Valeur d'une heure"], "multiply"]];
const $=id=>document.getElementById(id);
const cats=[...new Set(apps.map(a=>a[1]))].sort();
cats.forEach(c=>{let o=document.createElement('option');o.value=o.textContent=c;$('category').append(o)});
function render(){let q=$('search').value.toLowerCase(),c=$('category').value,filtered=apps.map((a,i)=>({a,i})).filter(x=>(!c||x.a[1]===c)&&x.a.join(' ').toLowerCase().includes(q));$('count').textContent=filtered.length+' applications';$('cards').replaceChildren();filtered.forEach(({a,i})=>{let b=document.createElement('button');b.className='card';let title=document.createElement('b');title.textContent=a[0];let sub=document.createElement('small');sub.textContent=a[1]+' • '+a[2];b.append(title,sub);b.onclick=()=>openApp(i);$('cards').append(b)})}
$('search').oninput=render;$('category').onchange=render;
function openApp(i){let a=apps[i];$('catalog').hidden=true;$('app').hidden=false;$('title').textContent=a[0];$('subtitle').textContent=a[2];$('fields').replaceChildren();a[3].forEach((f,j)=>{let l=document.createElement('label'),s=document.createElement('span'),n=document.createElement('input');s.textContent=f;n.type='number';n.inputMode='decimal';n.step='any';n.id='n'+j;n.placeholder='0';l.append(s,n);$('fields').append(l)});$('result').textContent='';$('calculate').onclick=()=>calculate(a);window.scrollTo(0,0)}
$('back').onclick=()=>{$('app').hidden=true;$('catalog').hidden=false};
function calculate(a){let v=a[3].map((_,i)=>Number($('n'+i).value));if(v.some(x=>!Number.isFinite(x)||x<0)){$('result').textContent='Saisissez des valeurs positives.';return}let [x=0,y=0,z=0,w=0]=v,r,unit=' €';const div=(a,b)=>b>0?a/b:null;switch(a[4]){
case 'profit':r=y-x-z;break;case 'profit2':r=x-y-z;break;case 'profit3':r=x-y-z-w;break;
case 'sum':r=v.reduce((s,n)=>s+n,0);break;case 'subtract':r=x-y-z;break;case 'multiply':r=x*y;break;
case 'yield':r=div(x*12,y+z)*100;unit=' %';break;case 'months':r=div(Math.max(0,x-y),z);unit=' mois';break;
case 'loan':{let t=y/1200;r=z>0?(t===0?x/z:x*t/(1-Math.pow(1+t,-z))):null;break}
case 'daily':r=div(x+y,z);break;case 'vat':r=x*(1+y/100);break;case 'discount':r=x*(1-y/100);break;
case 'split':r=div(x*(1+y/100),z);break;case 'fuel':r=x*y*z/100;break;
case 'perunit':r=div(x+y,z);break;case 'perunit2':r=div(x,y);unit=a[0]==='BH Lecture'?' heures':a[0]==='BH Chien'?' jours':' €';break;
case 'paint':r=div(x*z,y);unit=' litres';break;case 'tiles':r=div(x*(1+z/100),y);r=r===null?null:Math.ceil(r);unit=' carreaux';break;
case 'volume':r=x*y*z;unit=' m³';break;case 'plants':r=div(x*y,z);r=r===null?null:Math.floor(r);unit=' plants';break;
case 'power':r=x*y*z/1000;break;case 'pace':r=div(y,x);unit=' min/km';break;case 'walk':r=div(x,y)*60;unit=' minutes';break;
case 'weighted':r=div(x*y+z*w,y+w);unit=' /20 (si notes sur 20)';break;case 'sessions':r=y>0?Math.ceil(x*60/y):null;unit=' sessions';break;
case 'triple':r=x*y*z;break;case 'roas':r=div(x,y);unit=' ×';break;case 'ratio':r=div(x,y)*100;unit=' %';break;
case 'saas':r=x*y-z;break;case 'ceilratio':r=div(x,y);r=r===null?null:Math.ceil(r);unit=' ventes';break;
default:r=null}
$('result').textContent=r===null||!Number.isFinite(r)?'Veuillez renseigner un dénominateur supérieur à zéro.':'Résultat : '+new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(r)+unit}
render();
</script></html>
